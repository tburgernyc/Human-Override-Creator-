# CI: typecheck + test + build on every push/PR. `npm test` runs the
# unit/integration suites under tsx (smoke-helpers, lut-migration, and the
# verify-mp4 fixture e2e), gating merges on regressions before the slower
# build step.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only one run per ref at a time — cancel any in-flight build for the same PR
# when a new commit lands so we don't waste runners on stale work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (frontend)
        run: npx tsc --noEmit

      - name: Typecheck (server)
        run: npx tsc --noEmit -p server/tsconfig.json

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
